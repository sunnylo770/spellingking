<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee Challenge 🐝</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        /* Casual Game UI Colors & Styling */
        :root {
            --bg-green: #79a365;
            --panel-cream: #fcebbb;
            --border-brown: #7b4317;
            --btn-green: #5c9c5d;
            --btn-green-shadow: #3f703f;
            --text-dark: #4a331c;
        }

        body {
            font-family: 'Polyamine', 'Comic Sans MS', 'Fredoka One', cursive, sans-serif;
            background-color: var(--bg-green);
            color: var(--text-dark);
            overflow-x: hidden;
            touch-action: manipulation;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header */
        #global-header {
            display: none;
            width: 100%;
            background-color: var(--border-brown);
            color: var(--panel-cream);
            padding: 0.5rem 1rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 50;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 1rem;
            flex-grow: 1;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 3D Panel */
        .card {
            background-color: var(--panel-cream);
            border: 6px solid var(--border-brown);
            border-radius: 2rem;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.1), 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            padding: 2rem;
            position: relative;
        }

        /* 3D Button */
        .btn-primary {
            background-color: var(--btn-green);
            color: white;
            font-weight: bold;
            padding: 1rem 2rem;
            border-radius: 9999px;
            border: 4px solid var(--border-brown);
            box-shadow: 0 6px 0 var(--btn-green-shadow), 0 10px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-align: center;
            cursor: pointer;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-primary:active {
            box-shadow: 0 0 0 var(--btn-green-shadow), 0 0 0 rgba(0,0,0,0);
            transform: translateY(6px);
        }

        .input-area {
            width: 100%;
            border: 4px solid var(--border-brown);
            border-radius: 1rem;
            padding: 1rem;
            font-size: 1.2rem;
            background-color: #fff9e6;
            resize: vertical;
        }

        /* Keyboard Styles */
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            width: 100%;
        }

        .key-btn {
            background-color: var(--panel-cream);
            border: 3px solid var(--border-brown);
            border-radius: 0.75rem;
            color: var(--border-brown);
            font-weight: bold;
            font-size: 1.2rem;
            padding: 0.75rem 0.5rem;
            min-width: 2.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #d9a05b;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            max-width: 4rem;
        }

        .key-btn.wide { flex: 2; max-width: 6rem; background-color: #f3d482; }
        .key-btn.space { flex: 5; max-width: 20rem; }
        
        .key-btn:active, .key-btn.active-press {
            box-shadow: 0 0 0 transparent;
            transform: translateY(4px);
            background-color: #e5c07b;
        }

        .typed-display {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 0.3rem;
            min-height: 5rem;
            border-bottom: 6px dashed var(--border-brown);
            margin-bottom: 1.5rem;
            width: 100%;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--border-brown);
        }

        /* Progress Bar 3D */
        .progress-container {
            border: 4px solid var(--border-brown);
            background-color: #4a331c;
            border-radius: 9999px;
            padding: 4px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }

        .progress-fill {
            background: linear-gradient(to bottom, #7acc7a, #5c9c5d);
            border-radius: 9999px;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), inset 0 3px 0 rgba(255,255,255,0.4);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* UI Elements */
        .heart { transition: transform 0.3s; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2)); }
        .heart.lost { filter: grayscale(100%) opacity(0.4); transform: scale(0.8); }

        .timer-badge {
            background-color: #fff9e6;
            border: 4px solid var(--border-brown);
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            font-size: 2rem;
            font-weight: bold;
            color: #d92d20;
            box-shadow: 0 4px 0 #d9a05b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Popups & Animations */
        #popup-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 100;
        }

        .popup-msg {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 0 var(--border-brown), -2px -2px 0 var(--border-brown), 2px -2px 0 var(--border-brown), -2px 2px 0 var(--border-brown), 2px 2px 0 var(--border-brown);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .popup-msg.show {
            opacity: 1;
            transform: scale(1);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake-animation { animation: shake 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .animate-bounce-custom { animation: bounce 1s infinite; }
        
        .pulse-urgent { animation: pulseUrgent 1s infinite; }
        @keyframes pulseUrgent {
            0%, 100% { transform: scale(1); color: #d92d20; }
            50% { transform: scale(1.1); color: #ff0000; }
        }

        /* Numpad Styles */
        .numpad-btn {
            background-color: #f3d482;
            border: 3px solid var(--border-brown);
            border-radius: 0.5rem;
            color: var(--border-brown);
            font-weight: bold;
            font-size: 1.2rem;
            padding: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #d9a05b;
            transition: all 0.1s;
            text-align: center;
        }
        .numpad-btn:active {
            box-shadow: 0 0 0 transparent;
            transform: translateY(4px);
            background-color: #e5c07b;
        }
        .numpad-btn.enter {
            background-color: var(--btn-green);
            color: white;
            box-shadow: 0 4px 0 var(--btn-green-shadow);
            border-color: var(--border-brown);
        }
        .numpad-btn.enter:active {
            box-shadow: 0 0 0 transparent;
            transform: translateY(4px);
            background-color: var(--btn-green-shadow);
        }
        .numpad-btn.clear {
            background-color: #d92d20;
            color: white;
            box-shadow: 0 4px 0 #991b1b;
            border-color: var(--border-brown);
        }
        .numpad-btn.clear:active {
            box-shadow: 0 0 0 transparent;
            transform: translateY(4px);
        }
    </style>
</head>
<body>

    <!-- Global Header -->
    <div id="global-header">
        <span id="display-date"></span> | <span id="display-class"></span>
    </div>

    <!-- Screen 1: Teacher Setup -->
    <div id="screen-setup" class="screen active">
        <div class="card flex flex-col items-center">
            <h1 class="text-4xl font-bold mb-6 text-center" style="color: var(--border-brown);">🐝 Setup</h1>
            
            <div class="w-full flex gap-4 mb-4">
                <div class="flex-1">
                    <label class="font-bold text-lg">Class Name:</label>
                    <input type="text" id="class-input" class="input-area" placeholder="e.g. Grade 4A">
                </div>
                <div class="flex-1">
                    <label class="font-bold text-lg">Date:</label>
                    <input type="date" id="date-input" class="input-area">
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-4 w-full mb-6">
                <!-- Numpad & Range -->
                <div class="flex flex-col gap-2 bg-[#fff9e6] p-4 rounded-xl border-4 border-[var(--border-brown)] md:min-w-[220px]">
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-bold text-lg">Range:</label>
                        <div>
                            <input type="file" id="pdf-upload" accept=".pdf" class="hidden" onchange="handlePDFUpload(event)">
                            <label for="pdf-upload" class="btn-primary text-sm py-1 px-2 cursor-pointer flex items-center justify-center m-0" style="font-size: 0.8rem;">
                                📄 Upload PDF
                            </label>
                        </div>
                    </div>
                    <input type="text" id="range-input" class="input-area !p-2 text-center font-bold tracking-widest text-2xl" placeholder="e.g. 1-13" onkeypress="if(event.key === 'Enter') applyWordRange()">
                    <div class="grid grid-cols-3 gap-2 mt-2">
                        <button class="numpad-btn" onclick="handleNumpad('1')">1</button>
                        <button class="numpad-btn" onclick="handleNumpad('2')">2</button>
                        <button class="numpad-btn" onclick="handleNumpad('3')">3</button>
                        <button class="numpad-btn" onclick="handleNumpad('4')">4</button>
                        <button class="numpad-btn" onclick="handleNumpad('5')">5</button>
                        <button class="numpad-btn" onclick="handleNumpad('6')">6</button>
                        <button class="numpad-btn" onclick="handleNumpad('7')">7</button>
                        <button class="numpad-btn" onclick="handleNumpad('8')">8</button>
                        <button class="numpad-btn" onclick="handleNumpad('9')">9</button>
                        <button class="numpad-btn clear" onclick="handleNumpad('Clear')">C</button>
                        <button class="numpad-btn" onclick="handleNumpad('0')">0</button>
                        <button class="numpad-btn" onclick="handleNumpad('-')">-</button>
                        <button class="numpad-btn enter col-span-3" onclick="handleNumpad('Enter')">Enter ↵</button>
                    </div>
                </div>

                <!-- Textarea -->
                <div class="flex flex-col flex-1">
                    <label class="font-bold text-lg mb-1">Today's Words:</label>
                    <textarea id="word-input" class="input-area h-full min-h-[200px]" placeholder="Upload PDF and enter a range like '1-13', then press Enter..."></textarea>
                </div>
            </div>
            
            <button onclick="goToReview()" class="btn-primary w-full">Next ➔</button>
        </div>
    </div>

    <!-- Screen 2: Class Review -->
    <div id="screen-review" class="screen">
        <div class="card flex flex-col items-center">
            <h2 class="text-4xl font-bold mb-6 text-center" style="color: var(--border-brown);">Today's Words</h2>
            <div id="word-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 w-full mb-8 text-2xl font-bold text-center">
                <!-- Words injected here -->
            </div>
            <div class="flex gap-4 w-full">
                <button onclick="goToSetup()" class="btn-primary flex-1" style="background-color: #d1d5db; border-color: #9ca3af; box-shadow: 0 6px 0 #9ca3af; color: #4b5563;">Back</button>
                <button onclick="startGame()" class="btn-primary flex-2 w-full">Start Game 🚀</button>
            </div>
        </div>
    </div>

    <!-- Screen 3: Main Game -->
    <div id="screen-game" class="screen">
        <div class="card relative">
            <!-- Popup Overlay for Rewards -->
            <div id="popup-overlay">
                <div id="popup-text" class="popup-msg">Excellent!</div>
            </div>

            <!-- Header Info: Hearts & Timer -->
            <div class="flex justify-between items-center mb-4">
                <div class="flex gap-2" id="hearts-container">
                    <span class="text-4xl heart">❤️</span>
                    <span class="text-4xl heart">❤️</span>
                    <span class="text-4xl heart">❤️</span>
                    <span class="text-4xl heart">❤️</span>
                    <span class="text-4xl heart">❤️</span>
                </div>
                <div id="timer-display" class="timer-badge">
                    ⏱️ <span id="time-left">30</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mb-4">
                <div class="flex justify-between items-end mb-2">
                    <span class="font-bold text-xl uppercase tracking-wider">Goal</span>
                    <span class="font-bold text-3xl" id="progress-text" style="color: var(--border-brown);">0 / 50</span>
                </div>
                <div class="progress-container h-8 w-full">
                    <div id="progress-bar" class="progress-fill h-full" style="width: 0%"></div>
                </div>
            </div>

            <!-- Audio Button -->
            <div class="flex flex-col items-center mb-2">
                <button onclick="speakWord()" class="btn-primary rounded-full p-4 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M12 4v16m0 0l-4-4H4a2 2 0 01-2-2V8a2 2 0 012-2h4l4-4z" />
                    </svg>
                </button>
            </div>

            <!-- Typed Word Display -->
            <div id="typed-word" class="typed-display"></div>

            <!-- Keyboard -->
            <div id="keyboard" class="flex flex-col items-center w-full max-w-2xl mx-auto">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Screen 4: Victory -->
    <div id="screen-victory" class="screen">
        <div class="card text-center p-12">
            <div class="text-7xl mb-6 animate-bounce-custom">🏆🐝🎉</div>
            <h2 class="text-5xl font-bold mb-4 uppercase" style="color: var(--border-brown);">Goal Met!</h2>
            <p class="text-2xl mb-8 font-medium">You spelled 50 words correctly today!</p>
            <button onclick="goToSetup()" class="btn-primary w-full">Play Again</button>
        </div>
    </div>

    <script>
        // --- State ---
        let wordList = [];
        let currentWordIndex = 0;
        let currentTargetWord = "";
        let currentTyped = "";
        let isShifted = false;
        let score = 0;
        let lives = 5;
        const GOAL = 50;
        
        let timerInterval;
        let timeLeft = 30;
        let consecutiveCorrect = 0;
        let isProcessing = false; // prevents typing while animating
        
        let cachedWordMap = new Map(); // Store PDF data in memory

        // Default Date
        document.getElementById('date-input').valueAsDate = new Date();

        // --- PDF Processing Setup ---
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function handlePDFUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadBtnLabel = document.querySelector('label[for="pdf-upload"]');
            const originalText = uploadBtnLabel.innerHTML;
            uploadBtnLabel.innerHTML = '⏳...';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const text = textContent.items.map(item => item.str.trim()).filter(s => s).join(' ');
                    fullText += text + " ";
                }

                cachedWordMap.clear();
                const regex = /\b(\d{1,3})\s+([a-zA-Z]{2,})\b/g;
                let match;
                while ((match = regex.exec(fullText)) !== null) {
                    const num = parseInt(match[1], 10);
                    const word = match[2].toLowerCase();
                    if (!cachedWordMap.has(num)) {
                        cachedWordMap.set(num, word);
                    }
                }

                applyWordRange(); // Try to apply current range if one is already typed

            } catch (error) {
                console.error("Error parsing PDF:", error);
                uploadBtnLabel.innerHTML = '❌ Err';
                setTimeout(() => uploadBtnLabel.innerHTML = originalText, 2000);
                return;
            } 
            
            uploadBtnLabel.innerHTML = '✅ OK!';
            setTimeout(() => uploadBtnLabel.innerHTML = originalText, 2000);
            event.target.value = ''; // Reset input
        }

        function handleNumpad(val) {
            const input = document.getElementById('range-input');
            if (val === 'Clear') {
                input.value = '';
            } else if (val === 'Enter') {
                applyWordRange();
            } else {
                input.value += val;
            }
        }

        function applyWordRange() {
            const inputVal = document.getElementById('range-input').value.trim();
            const textarea = document.getElementById('word-input');
            
            if (!inputVal) return;
            
            if (cachedWordMap.size === 0) {
                textarea.value = "Please upload a PDF first!";
                setTimeout(() => { if(textarea.value === "Please upload a PDF first!") textarea.value = ""; }, 2000);
                return;
            }

            const parts = inputVal.split('-');
            let extractedWords = [];

            if (parts.length === 2 && parts[0] && parts[1]) {
                const start = parseInt(parts[0], 10);
                const end = parseInt(parts[1], 10);
                for (let i = start; i <= end; i++) {
                    if (cachedWordMap.has(i)) {
                        extractedWords.push(cachedWordMap.get(i));
                    }
                }
            } else if (parts.length === 1 && parts[0]) {
                const num = parseInt(parts[0], 10);
                if (cachedWordMap.has(num)) {
                    extractedWords.push(cachedWordMap.get(num));
                }
            }

            if (extractedWords.length > 0) {
                textarea.value = extractedWords.join('\n');
            } else {
                textarea.value = "No words found in that range.";
                setTimeout(() => { if(textarea.value === "No words found in that range.") textarea.value = ""; }, 2000);
            }
        }

        // --- Audio Setup ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'boost') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(1600, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function speakWord(word = currentTargetWord) {
            if (!word) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        // --- Navigation ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goToSetup() {
            clearInterval(timerInterval);
            document.getElementById('global-header').style.display = 'none';
            showScreen('screen-setup');
        }

        function goToReview() {
            const input = document.getElementById('word-input').value;
            wordList = input.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
            
            // Shuffle the word list
            for (let i = wordList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [wordList[i], wordList[j]] = [wordList[j], wordList[i]];
            }
            
            const className = document.getElementById('class-input').value || "No Class";
            const classDate = document.getElementById('date-input').value || "No Date";
            
            document.getElementById('display-class').textContent = className;
            document.getElementById('display-date').textContent = classDate;

            if (wordList.length === 0) {
                // Flash area to indicate error
                const wa = document.getElementById('word-input');
                wa.style.backgroundColor = '#ffcccc';
                setTimeout(()=> wa.style.backgroundColor = '#fff9e6', 500);
                return;
            }

            // Update Header
            document.getElementById('global-header').style.display = 'block';

            const grid = document.getElementById('word-grid');
            grid.innerHTML = '';
            wordList.forEach(word => {
                const div = document.createElement('div');
                div.className = 'bg-white p-3 rounded-xl border-4 border-gray-200 shadow-sm';
                div.textContent = word;
                grid.appendChild(div);
            });
            showScreen('screen-review');
        }

        function startGame() {
            score = 0;
            consecutiveCorrect = 0;
            currentWordIndex = 0;
            updateProgress();
            buildKeyboard();
            showScreen('screen-game');
            nextWord();
        }

        // --- Game Logic ---
        function nextWord() {
            isProcessing = false;
            
            // If we've gone through all words, reshuffle and start the list over
            if (currentWordIndex >= wordList.length) {
                for (let i = wordList.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [wordList[i], wordList[j]] = [wordList[j], wordList[i]];
                }
                currentWordIndex = 0;
            }
            
            currentTargetWord = wordList[currentWordIndex];
            currentWordIndex++;
            
            currentTyped = "";
            lives = 5;
            updateTypedDisplay();
            updateHearts();
            
            setTimeout(() => speakWord(), 300);
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const timerDisplay = document.getElementById('time-left');
            const timerBadge = document.getElementById('timer-display');
            
            timerDisplay.textContent = timeLeft;
            timerBadge.classList.remove('pulse-urgent');
            
            timerInterval = setInterval(() => {
                if(isProcessing) return; // Pause timer during animations
                
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                
                if (timeLeft <= 5) {
                    timerBadge.classList.add('pulse-urgent');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer(true);
                }
            }, 1000);
        }

        function updateProgress() {
            document.getElementById('progress-text').textContent = `${score} / ${GOAL}`;
            const percentage = Math.min(100, (score / GOAL) * 100);
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function updateHearts() {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('span');
                heart.textContent = '❤️';
                heart.className = `text-4xl heart ${i >= lives ? 'lost' : ''}`;
                container.appendChild(heart);
            }
        }

        function updateTypedDisplay() {
            document.getElementById('typed-word').textContent = currentTyped;
        }

        function showPopup(text, isBoost = false) {
            const popup = document.getElementById('popup-text');
            popup.textContent = text;
            if(isBoost) {
                popup.style.color = '#ffeb3b'; // Yellow for boost
                popup.style.transform = 'scale(1.2) rotate(-5deg)';
            } else {
                popup.style.color = 'white';
                popup.style.transform = 'scale(1)';
            }
            
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
                popup.style.transform = 'scale(0.5)'; // reset
            }, 1200);
        }

        function handleKeyPress(key) {
            if(isProcessing) return;

            if (key === 'BACKSPACE') {
                currentTyped = currentTyped.slice(0, -1);
            } else if (key === 'SHIFT') {
                isShifted = !isShifted;
                buildKeyboard();
                return;
            } else if (key === 'ENTER') {
                checkAnswer();
                return;
            } else {
                if (key === ' ' && currentTyped.length === 0) return;
                currentTyped += isShifted ? key.toUpperCase() : key;
            }
            updateTypedDisplay();
        }

        function checkAnswer() {
            if (currentTyped.trim() === "") return;
            isProcessing = true;
            clearInterval(timerInterval);

            if (currentTyped === currentTargetWord) {
                // Correct
                playTone('correct');
                score++;
                consecutiveCorrect++;
                updateProgress();
                
                const display = document.getElementById('typed-word');
                display.style.color = 'var(--btn-green)';
                
                const rewards = ["Excellent!", "Great!", "Perfect!", "Awesome!"];
                let rewardText = rewards[Math.floor(Math.random() * rewards.length)];
                
                let isBoost = false;
                if (consecutiveCorrect > 0 && consecutiveCorrect % 5 === 0) {
                    rewardText = "🔥 COMBO x" + consecutiveCorrect + "!";
                    isBoost = true;
                    setTimeout(() => playTone('boost'), 200);
                }

                showPopup(rewardText, isBoost);
                
                setTimeout(() => {
                    display.style.color = 'var(--border-brown)';
                    if (score >= GOAL) {
                        document.getElementById('global-header').style.display = 'none';
                        showScreen('screen-victory');
                    } else {
                        nextWord();
                    }
                }, 1500);
                
            } else {
                handleWrongAnswer(false);
            }
        }

        function handleWrongAnswer(isTimeout) {
            isProcessing = true;
            playTone('wrong');
            consecutiveCorrect = 0; // Reset combo
            lives--;
            updateHearts();
            
            const display = document.getElementById('typed-word');
            display.classList.add('shake-animation');
            display.style.color = '#d92d20'; // Red
            
            if(isTimeout) {
                showPopup("Time's Up!");
            }

            setTimeout(() => {
                display.classList.remove('shake-animation');
                display.style.color = 'var(--border-brown)';
                currentTyped = ""; 
                updateTypedDisplay();
                
                if (lives <= 0) {
                    // Reset lives and retry same word
                    lives = 5;
                    updateHearts();
                    showPopup("Try Again!");
                    setTimeout(() => {
                        isProcessing = false;
                        speakWord();
                        startTimer();
                    }, 1500);
                } else {
                    isProcessing = false;
                    startTimer(); // resume timer for this word
                }
            }, 800);
        }

        // --- Keyboard Generation ---
        const layout = [
            ['q','w','e','r','t','y','u','i','o','p'],
            ['a','s','d','f','g','h','j','k','l'],
            ['SHIFT','z','x','c','v','b','n','m','BACKSPACE'],
            ['SPACE', 'ENTER']
        ];

        function buildKeyboard() {
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';

            layout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key-btn';
                    
                    let displayKey = key;
                    let actionKey = key;

                    if (key === 'SHIFT') {
                        displayKey = isShifted ? '⇧' : '⇪';
                        btn.classList.add('wide');
                        if (isShifted) btn.style.backgroundColor = '#e5c07b';
                    } else if (key === 'BACKSPACE') {
                        displayKey = '⌫';
                        btn.classList.add('wide');
                    } else if (key === 'SPACE') {
                        displayKey = 'Space';
                        btn.classList.add('space');
                        actionKey = ' ';
                    } else if (key === 'ENTER') {
                        displayKey = 'Enter ↵';
                        btn.classList.add('wide');
                        btn.style.backgroundColor = 'var(--btn-green)';
                        btn.style.color = 'white';
                        btn.style.borderColor = 'var(--btn-green-shadow)';
                        btn.style.boxShadow = '0 4px 0 var(--btn-green-shadow)';
                    } else {
                        displayKey = isShifted ? key.toUpperCase() : key;
                        actionKey = displayKey;
                    }

                    btn.textContent = displayKey;
                    
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        if(isProcessing) return;
                        btn.classList.add('active-press');
                        handleKeyPress(actionKey);
                        setTimeout(() => btn.classList.remove('active-press'), 100);
                    });

                    rowDiv.appendChild(btn);
                });
                kbContainer.appendChild(rowDiv);
            });
        }

        // --- Physical Keyboard Binding ---
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('screen-game').classList.contains('active')) {
                if (e.key === 'Enter') {
                    handleKeyPress('ENTER');
                } else if (e.key === 'Backspace') {
                    handleKeyPress('BACKSPACE');
                } else if (e.key === 'Shift') {
                    isShifted = true;
                    buildKeyboard();
                } else if (e.key.length === 1) { 
                    handleKeyPress(e.key);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (document.getElementById('screen-game').classList.contains('active')) {
                if (e.key === 'Shift') {
                    isShifted = false;
                    buildKeyboard();
                }
            }
        });

    </script>
</body>
</html>
